
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit SAST and Quality Gate
        run: |
          bandit -r app -ll -ii -f json -o bandit-report.json
          python -c "import json; r=json.load(open('bandit-report.json')); issues=r['results']; high=[i for i in issues if i['issue_severity']=='HIGH' and i['issue_confidence']=='HIGH']; print(f'Total findings: {len(issues)}'); print(f'High severity and high confidence: {len(high)}'); raise SystemExit(1 if high else 0)"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore
